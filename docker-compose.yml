services:
  quiz:
    image: ghcr.io/ex0th/schnobbis-quiz:latest
    # Lokal selbst bauen statt Image ziehen:
    # build: .
    container_name: schnobbis-quiz
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8080
      - DATA_DIR=/data
    volumes:
      - quiz-data:/data

volumes:
  quiz-data:
